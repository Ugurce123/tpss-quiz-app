<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosya Yükleme Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .preview { margin: 10px 0; max-width: 200px; }
        .result { margin: 20px 0; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <h1>🧪 Dosya Yükleme Test</h1>
    
    <form id="uploadForm">
        <div class="form-group">
            <label for="text">Soru Metni:</label>
            <textarea id="text" required>Test sorusu - dosya yükleme</textarea>
        </div>
        
        <div class="form-group">
            <label for="correctAnswer">Doğru Cevap:</label>
            <select id="correctAnswer">
                <option value="clean">Temiz</option>
                <option value="dirty">Kirli</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="level">Seviye:</label>
            <input type="number" id="level" value="1" min="1" max="50">
        </div>
        
        <div class="form-group">
            <label for="image">Görsel Dosyası:</label>
            <input type="file" id="image" accept="image/*" required>
            <div id="preview"></div>
        </div>
        
        <button type="submit">📤 Yükle ve Test Et</button>
    </form>
    
    <div id="result" style="display: none;"></div>

    <script>
        // Önizleme
        document.getElementById('image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('preview');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" class="preview" alt="Önizleme">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Form gönderimi
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            const formData = new FormData();
            
            // Form verilerini ekle
            formData.append('text', document.getElementById('text').value);
            formData.append('correctAnswer', document.getElementById('correctAnswer').value);
            formData.append('level', document.getElementById('level').value);
            formData.append('points', '10');
            formData.append('explanation', 'Test açıklaması');
            formData.append('difficulty', 'easy');
            formData.append('category', 'test');
            
            // Dosyayı ekle
            const fileInput = document.getElementById('image');
            if (fileInput.files[0]) {
                formData.append('image', fileInput.files[0]);
            }
            
            // Kirli bagaj için ek bilgiler
            if (document.getElementById('correctAnswer').value === 'dirty') {
                formData.append('dirtyReason', 'sharp_objects');
                formData.append('dirtyOptions', JSON.stringify([
                    { value: 'sharp_objects', label: 'Kesici/Delici Alet' }
                ]));
            }
            
            try {
                console.log('🚀 Upload başlatılıyor...');
                
                // Admin token'ı al (localStorage'dan)
                const token = localStorage.getItem('token');
                if (!token) {
                    throw new Error('Admin token bulunamadı! Önce admin olarak giriş yapın.');
                }
                
                const response = await fetch('http://localhost:5001/api/questions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Başarılı!</h3>
                        <p><strong>Soru ID:</strong> ${result._id}</p>
                        <p><strong>Görsel:</strong> ${result.image}</p>
                        <p><strong>Seviye:</strong> ${result.level}</p>
                    `;
                    console.log('✅ Upload başarılı:', result);
                } else {
                    throw new Error(result.message || 'Upload başarısız');
                }
                
            } catch (error) {
                console.error('❌ Upload hatası:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Hata!</h3>
                    <p>${error.message}</p>
                `;
            }
            
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
