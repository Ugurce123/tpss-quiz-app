<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel Deployment Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .loading { background-color: #fff3cd; color: #856404; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Vercel Deployment Test</h1>
    
    <div>
        <button onclick="testAPI()">Test API Health</button>
        <button onclick="testAuth()">Test Auth Endpoint</button>
        <button onclick="testQuiz()">Test Quiz Endpoint</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'https://tpss-quiz-app.vercel.app';
        
        function addResult(message, type = 'loading') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
            return div;
        }
        
        async function testAPI() {
            const result = addResult('Testing API health...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                result.textContent = `✅ API Health: ${JSON.stringify(data)}`;
                result.className = 'test-result success';
            } catch (error) {
                result.textContent = `❌ API Health Error: ${error.message}`;
                result.className = 'test-result error';
            }
        }
        
        async function testAuth() {
            const result = addResult('Testing auth endpoint...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'test'
                    })
                });
                
                if (response.status === 401) {
                    result.textContent = '✅ Auth endpoint working (401 expected for invalid credentials)';
                    result.className = 'test-result success';
                } else {
                    const data = await response.text();
                    result.textContent = `⚠️ Auth response: ${response.status} - ${data}`;
                    result.className = 'test-result error';
                }
            } catch (error) {
                result.textContent = `❌ Auth Error: ${error.message}`;
                result.className = 'test-result error';
            }
        }
        
        async function testQuiz() {
            const result = addResult('Testing quiz endpoint...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/api/quiz/start/1`);
                const data = await response.text();
                result.textContent = `Quiz endpoint response: ${response.status} - ${data.substring(0, 100)}...`;
                result.className = response.ok ? 'test-result success' : 'test-result error';
            } catch (error) {
                result.textContent = `❌ Quiz Error: ${error.message}`;
                result.className = 'test-result error';
            }
        }
    </script>
</body>
</html>
