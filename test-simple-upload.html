<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .preview { max-width: 200px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 Basit Upload Test</h1>
    <p>Bu test multer'ın çalışıp çalışmadığını kontrol eder.</p>
    
    <form id="uploadForm">
        <div class="form-group">
            <label for="image">Görsel Seç:</label>
            <input type="file" id="image" accept="image/*" required>
            <div id="preview"></div>
        </div>
        
        <button type="submit">📤 Test Upload</button>
    </form>
    
    <div id="result" style="display: none;"></div>

    <script>
        // Önizleme
        document.getElementById('image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('preview');
            
            if (file) {
                console.log('📁 Dosya seçildi:', {
                    name: file.name,
                    size: file.size,
                    type: file.type
                });
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" class="preview" alt="Önizleme">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Form gönderimi
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            const formData = new FormData();
            
            // Dosyayı ekle
            const fileInput = document.getElementById('image');
            if (fileInput.files[0]) {
                formData.append('image', fileInput.files[0]);
                console.log('📦 FormData hazırlandı');
            } else {
                alert('Lütfen bir dosya seçin!');
                return;
            }
            
            try {
                console.log('🚀 Test upload başlatılıyor...');
                
                const response = await fetch('http://localhost:5002/test-upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                console.log('📥 Response:', result);
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Test Başarılı!</h3>
                        <p><strong>Dosya:</strong> ${result.filename}</p>
                        <p><strong>URL:</strong> <a href="http://localhost:5002${result.url}" target="_blank">${result.url}</a></p>
                        <p><strong>Boyut:</strong> ${(result.size / 1024).toFixed(2)} KB</p>
                        <p><strong>Tip:</strong> ${result.mimetype}</p>
                        <img src="http://localhost:5002${result.url}" class="preview" alt="Yüklenen görsel">
                    `;
                } else {
                    throw new Error(result.error || 'Upload başarısız');
                }
                
            } catch (error) {
                console.error('❌ Test hatası:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Test Başarısız!</h3>
                    <p>${error.message}</p>
                `;
            }
            
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
