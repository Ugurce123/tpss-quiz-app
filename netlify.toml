# Netlify Configuration for Baggage Quiz App

[build]
  # Build command
  command = "cd client && npm install && npm run build"
  
  # Publish directory
  publish = "client/build"
  
  # Base directory
  base = "/"

[build.environment]
  # Node version
  NODE_VERSION = "18"
  
  # React environment
  CI = "false"

# Redirects and rewrites
[[redirects]]
  # SPA fallback - tüm route'lar index.html'e yönlendirilir
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy - Backend için
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-url.herokuapp.com/api/:splat"
  status = 200
  force = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"